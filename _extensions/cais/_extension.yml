title: CAIS
author: Center for Advanced Internet Studies (CAIS) gGmbH
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    revealjs:
      theme: [default, theme.scss]
      width: 1600
      height: 900
      margin: 0
      center: false
      slide-number: true
      progress: false
      hash: true
      controls: false
      navigationMode: linear
      transition: none
      background-transition: none
      highlight-style: github
      template-partials:
        - title-slide.html
      include-in-header:
        - text: |
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
